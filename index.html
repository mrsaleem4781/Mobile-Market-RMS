<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mobile Market Record Management System</title>
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Prevent browser read-only fetch setter errors in sandboxed iframes
      (function() {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            var customFetch = originalFetch;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return customFetch;
              },
              set: function(val) {
                customFetch = val;
              }
            });
          }
        } catch (e) {
          console.warn("Could not patch window.fetch: ", e);
        }
      })();

      // Register PWA Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(reg) {
              console.log('MMRMS ServiceWorker registered successfully with scope: ', reg.scope);
            })
            .catch(function(err) {
              console.warn('MMRMS ServiceWorker registration failed: ', err);
            });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
