<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#0f172a" />
  
  <!-- Subtle Grid Accent -->
  <path d="M0,128 L512,128 M0,256 L512,256 M0,384 L512,384 M128,0 L128,512 M256,0 L256,512 M384,0 L384,512" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 8" />

  <!-- Shield Core -->
  <path d="M256,64 C342.4,64 416,91.2 416,134.4 C416,262.4 340.8,368 256,448 C171.2,368 96,262.4 96,134.4 C96,91.2 169.6,64 256,64 Z" fill="url(#shieldGrad)" filter="url(#glow)" />
  
  <!-- Inner Shield Highlight Border -->
  <path d="M256,80 C329.6,80 392,103.2 392,140 C392,248.8 328,338.4 256,406.4 C184,338.4 120,248.8 120,140 C120,103.2 182.4,80 256,80 Z" fill="none" stroke="#34d399" stroke-width="4" opacity="0.4" />

  <!-- Smartphone Graphic -->
  <rect x="206" y="156" width="100" height="180" rx="14" fill="url(#phoneGrad)" />
  <!-- Screen Area -->
  <rect x="214" y="174" width="84" height="136" rx="4" fill="#0f172a" />
  
  <!-- Camera Notch -->
  <circle cx="256" cy="165" r="3" fill="#64748b" />
  <!-- Home Indicator -->
  <rect x="246" y="322" width="20" height="3" rx="1.5" fill="#94a3b8" />

  <!-- Checkmark inside Screen -->
  <path d="M236,242 L250,256 L276,220" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Radiating Signals/Security Rings -->
  <path d="M150,180 A160,160 0 0,1 150,300" fill="none" stroke="#6ee7b7" stroke-width="6" stroke-linecap="round" opacity="0.75" />
  <path d="M362,180 A160,160 0 0,0 362,300" fill="none" stroke="#6ee7b7" stroke-width="6" stroke-linecap="round" opacity="0.75" />
</svg>
